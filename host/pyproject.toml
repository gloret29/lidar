[project]
name = "lidar-host"
version = "0.1.0"
description = "Station hôte pour le scanner 3D LiDAR DIY"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "open3d>=0.17",
]

[project.scripts]
lidar-visualize = "lidar_host.visualize:main"
lidar-receive = "lidar_host.receiver:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
