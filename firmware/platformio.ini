; ============================================================
;  Scanner 3D LiDAR — firmware ESP32-S3
;
;  Environnements :
;    seed      amorce OTA, premier flash USB
;              pio run -e seed -t upload
;    seed-ota  même amorce, mise à jour par le réseau
;    usb       firmware scanner, câble
;    ota       firmware scanner, réseau
;              pio run -e ota -t upload
;              pio run -e ota -t uploadfs
;
;  Voir docs/ota.md.
; ============================================================

[platformio]
default_envs = seed

[common]
platform = espressif32@^6.5.0
board = esp32-s3-devkitc-1-n16r8
framework = arduino
monitor_speed = 115200

; Variante N16R8 : 16 Mo Flash QIO + 8 Mo PSRAM octale.
; Définition dans boards/esp32-s3-devkitc-1-n16r8.json.
; La PSRAM octale occupe les GPIO 33-37, à ne jamais utiliser.
; default_16MB.csv : app0 + app1 + partition data (LittleFS).
board_build.partitions = default_16MB.csv
board_build.filesystem = littlefs
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 16MB

build_flags =
    -DCORE_DEBUG_LEVEL=3
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1

; Le firmware scanner exclut l'amorce (deux setup()/loop() sinon).
build_src_filter = +<*> -<seed/>

lib_deps =
    tzapu/WiFiManager@^2.0.17
    teemuatlut/TMCStepper@^0.7.3

monitor_filters = esp32_exception_decoder

[env:seed]
extends = common
upload_protocol = esptool
lib_deps = tzapu/WiFiManager@^2.0.17
build_src_filter =
    -<*>
    +<seed/>
    +<wifi_setup.cpp>

[env:seed-ota]
extends = env:seed
upload_protocol = espota
upload_port = lidar-scanner.local
upload_flags =
    --port=3232
    --auth=lidar-ota

[env:usb]
extends = common
upload_protocol = esptool

[env:ota]
extends = common
upload_protocol = espota
; Remplacer par l'IP du scanner si mDNS ne résout pas sur votre réseau.
upload_port = lidar-scanner.local
upload_flags =
    --port=3232
    --auth=lidar-ota
