; ============================================================
;  Scanner 3D LiDAR — firmware ESP32-S3
;
;  Deux environnements partagent la même configuration :
;    usb   téléversement par câble       pio run -e usb -t upload
;    ota   téléversement par le réseau   pio run -e ota -t upload
;
;  Voir docs/ota.md.
; ============================================================

[platformio]
default_envs = usb

[common]
platform = espressif32@^6.5.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200

; Variante N16R8 : 16 Mo Flash QIO + 8 Mo PSRAM octale.
; La PSRAM octale occupe les GPIO 33-37, à ne jamais utiliser.
; default_16MB.csv fournit app0 + app1 : indispensable pour l'OTA.
board_build.partitions = default_16MB.csv
board_build.arduino.memory_type = qio_opi

build_flags =
    -DCORE_DEBUG_LEVEL=3
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1

lib_deps =
    tzapu/WiFiManager@^2.0.17
    teemuatlut/TMCStepper@^0.7.3

monitor_filters = esp32_exception_decoder

[env:usb]
extends = common
upload_protocol = esptool

[env:ota]
extends = common
upload_protocol = espota
; Remplacer par l'IP du scanner si mDNS ne résout pas sur votre réseau.
upload_port = lidar-scanner.local
upload_flags =
    --port=3232
    --auth=lidar-ota
