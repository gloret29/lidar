<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="860" height="430" viewBox="0 0 860 430">
  <title>Signaux scanner LiDAR</title>
  <rect width="860" height="430" fill="#f7f7f5"/>
  <style>
    .box { fill:#fff; stroke:#222; stroke-width:1.5; }
    .box-pwr { fill:#fff8f0; stroke:#8b4513; stroke-width:1.5; }
    .box-mcu { fill:#eef4ff; stroke:#1a3a6b; stroke-width:1.5; }
    .box-sen { fill:#eefaf0; stroke:#1b5e20; stroke-width:1.5; }
    .box-mot { fill:#faf0ff; stroke:#4a148c; stroke-width:1.5; }
    .title { font:700 16px "Segoe UI",system-ui,sans-serif; fill:#111; }
    .label { font:600 12px "Segoe UI",system-ui,sans-serif; fill:#111; }
    .small { font:11px "Segoe UI",system-ui,sans-serif; fill:#333; }
    .note { font:11px "Segoe UI",system-ui,sans-serif; fill:#555; }
    .v12 { stroke:#c62828; stroke-width:2.5; fill:none; }
    .v5 { stroke:#ef6c00; stroke-width:2.2; fill:none; }
    .v33 { stroke:#1565c0; stroke-width:2; fill:none; }
    .gnd { stroke:#212121; stroke-width:2.5; fill:none; }
    .sig { stroke:#2e7d32; stroke-width:1.8; fill:none; }
    .sig2 { stroke:#6a1b9a; stroke-width:1.8; fill:none; }
    .leg { font:11px "Segoe UI",system-ui,sans-serif; fill:#222; }
  </style>
  <text x="24" y="28" class="title">Plan des signaux — ESP32-S3 ↔ périphériques</text>
<rect x="340" y="160" width="180" height="90" rx="6" class="box-mcu"/>
<text x="430.0" y="178" text-anchor="middle" class="label">ESP32-S3</text>
<text x="430.0" y="193" text-anchor="middle" class="small">DevKitC-1 N16R8</text>
<text x="430.0" y="208" text-anchor="middle" class="small">cœur du câblage</text>
<rect x="40" y="60" width="160" height="70" rx="6" class="box-sen"/>
<text x="120.0" y="78" text-anchor="middle" class="label">LD19 (tête)</text>
<text x="120.0" y="93" text-anchor="middle" class="small">UART 230400</text>
<text x="120.0" y="108" text-anchor="middle" class="small">PWM 30 kHz</text>
<rect x="40" y="200" width="160" height="70" rx="6" class="box-sen"/>
<text x="120.0" y="218" text-anchor="middle" class="label">MPU6050</text>
<text x="120.0" y="233" text-anchor="middle" class="small">I2C 0x68</text>
<text x="120.0" y="248" text-anchor="middle" class="small">base fixe</text>
<rect x="640" y="80" width="180" height="90" rx="6" class="box-mot"/>
<text x="730.0" y="98" text-anchor="middle" class="label">TMC2209</text>
<text x="730.0" y="113" text-anchor="middle" class="small">STEP/DIR/EN</text>
<text x="730.0" y="128" text-anchor="middle" class="small">UART StallGuard</text>
<rect x="640" y="230" width="180" height="60" rx="6" class="box-mot"/>
<text x="730.0" y="248" text-anchor="middle" class="label">NEMA 17</text>
<text x="730.0" y="263" text-anchor="middle" class="small">N/B = A  V/R = B</text>
<path d="M200,80 L340,180" class="sig"/>
<text x="250" y="110" text-anchor="middle" class="note">TX → GPIO18</text>
<path d="M200,100 L340,195" class="sig2"/>
<text x="255" y="135" text-anchor="middle" class="note">PWM ← GPIO17</text>
<path d="M200,225 L340,210" class="sig"/>
<text x="260" y="208" text-anchor="middle" class="note">SDA GPIO8</text>
<path d="M200,245 L340,225" class="sig2"/>
<text x="260" y="248" text-anchor="middle" class="note">SCL GPIO9</text>
<path d="M520,185 L640,110" class="sig"/>
<text x="575" y="130" text-anchor="middle" class="note">STEP 4</text>
<path d="M520,195 L640,125" class="sig2"/>
<text x="580" y="155" text-anchor="middle" class="note">DIR 5</text>
<path d="M520,205 L640,140" class="sig"/>
<text x="585" y="175" text-anchor="middle" class="note">EN 6</text>
<path d="M520,215 L640,155" class="sig2"/>
<text x="560" y="200" text-anchor="middle" class="note">UART 7/15</text>
<path d="M730,170 L730,230" class="v12"/>
<text x="750" y="200" text-anchor="middle" class="note">phases</text>
<text x="40" y="320" class="label">Résistance UART TMC</text>

    <rect x="40" y="330" width="420" height="70" rx="6" class="box"/>
    <text x="50" y="352" class="small">GPIO7 (TX) ──[ 1 kΩ ]──┬── PDN (TWOTREES, pas USART)</text>
    <text x="50" y="372" class="small">GPIO15 (RX) ────────────┘</text>
    <text x="50" y="390" class="note">MS1 = MS2 = GND → adresse UART 0. EN actif à l’état bas.</text>
    <text x="500" y="350" class="label">Interdits N16R8</text>
<text x="500" y="370" class="note">GPIO 33–37 = PSRAM (ne pas utiliser)</text>
<text x="500" y="388" class="note">Éviter aussi 19/20 (USB) et 26–32 (flash)</text>

</svg>
