<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="820" height="420" viewBox="0 0 820 420">
  <title>Ensemble scanner LiDAR</title>
  <rect width="820" height="420" fill="#f7f7f5"/>
  <style>
    .box { fill:#fff; stroke:#222; stroke-width:1.5; }
    .box-pwr { fill:#fff8f0; stroke:#8b4513; stroke-width:1.5; }
    .box-mcu { fill:#eef4ff; stroke:#1a3a6b; stroke-width:1.5; }
    .box-sen { fill:#eefaf0; stroke:#1b5e20; stroke-width:1.5; }
    .box-mot { fill:#faf0ff; stroke:#4a148c; stroke-width:1.5; }
    .title { font:700 16px "Segoe UI",system-ui,sans-serif; fill:#111; }
    .label { font:600 12px "Segoe UI",system-ui,sans-serif; fill:#111; }
    .small { font:11px "Segoe UI",system-ui,sans-serif; fill:#333; }
    .note { font:11px "Segoe UI",system-ui,sans-serif; fill:#555; }
    .v12 { stroke:#c62828; stroke-width:2.5; fill:none; }
    .v5 { stroke:#ef6c00; stroke-width:2.2; fill:none; }
    .v33 { stroke:#1565c0; stroke-width:2; fill:none; }
    .gnd { stroke:#212121; stroke-width:2.5; fill:none; }
    .sig { stroke:#2e7d32; stroke-width:1.8; fill:none; }
    .sig2 { stroke:#6a1b9a; stroke-width:1.8; fill:none; }
    .leg { font:11px "Segoe UI",system-ui,sans-serif; fill:#222; }
  </style>
  <text x="24" y="28" class="title">Schéma d’ensemble — Scanner 3D LiDAR DIY</text>
<rect x="40" y="50" width="200" height="80" rx="6" class="box"/>
<text x="140.0" y="68" text-anchor="middle" class="label">Tête tournante</text>
<text x="140.0" y="83" text-anchor="middle" class="small">LD19 + berceau</text>
<text x="140.0" y="98" text-anchor="middle" class="small">câble en hélice ±90°</text>
<rect x="300" y="50" width="220" height="80" rx="6" class="box-mcu"/>
<text x="410.0" y="68" text-anchor="middle" class="label">Boîtier (trépied)</text>
<text x="410.0" y="83" text-anchor="middle" class="small">ESP32-S3 + TMC2209</text>
<text x="410.0" y="98" text-anchor="middle" class="small">buck + trigger + MPU</text>
<rect x="580" y="50" width="200" height="80" rx="6" class="box-pwr"/>
<text x="680.0" y="68" text-anchor="middle" class="label">Énergie</text>
<text x="680.0" y="83" text-anchor="middle" class="small">Power bank PD</text>
<text x="680.0" y="98" text-anchor="middle" class="small">12 V + 5 V</text>
<rect x="300" y="180" width="220" height="70" rx="6" class="box-mot"/>
<text x="410.0" y="198" text-anchor="middle" class="label">Moteur fixe</text>
<text x="410.0" y="213" text-anchor="middle" class="small">NEMA 17 sous plateau</text>
<text x="410.0" y="228" text-anchor="middle" class="small">axe vertical</text>
<rect x="40" y="180" width="200" height="70" rx="6" class="box-sen"/>
<text x="140.0" y="198" text-anchor="middle" class="label">Station hôte</text>
<text x="140.0" y="213" text-anchor="middle" class="small">Wi‑Fi UDP :9000</text>
<text x="140.0" y="228" text-anchor="middle" class="small">Open3D / receive</text>
<path d="M240,90 L300,90" class="sig"/>
<text x="270" y="80" text-anchor="middle" class="note">UART+PWM</text>
<path d="M520,90 L580,90" class="v12"/>
<text x="550" y="80" text-anchor="middle" class="note">12/5 V</text>
<path d="M410,130 L410,180" class="sig2"/>
<text x="430" y="155" text-anchor="middle" class="note">STEP…</text>
<path d="M140,130 L140,180" class="sig"/>
<text x="160" y="155" text-anchor="middle" class="note">Wi‑Fi</text>
<text x="40" y="290" class="label">Règles d’or</text>
<text x="40" y="312" class="small">1. Une seule masse commune (trigger, buck, ESP, TMC, LD19, moteur).</text>
<text x="40" y="332" class="small">2. MPU6050 en 3,3 V uniquement — jamais en 5 V.</text>
<text x="40" y="352" class="small">3. LD19 TX → ESP32 RX (GPIO18). Inverser = silence total.</text>
<text x="40" y="372" class="small">4. 1 kΩ sur TX UART du TMC. Mesurer 12 V et 5 V avant branchement charges.</text>
<text x="40" y="392" class="small">5. Premier essai sans moteur ; mou du câble LiDAR ~120 mm en hélice.</text>

</svg>
