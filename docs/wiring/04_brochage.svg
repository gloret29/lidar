<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="680" height="488" viewBox="0 0 680 488">
  <title>Brochage ESP32-S3</title>
  <rect width="680" height="488" fill="#f7f7f5"/>
  <style>
    .box { fill:#fff; stroke:#222; stroke-width:1.5; }
    .box-pwr { fill:#fff8f0; stroke:#8b4513; stroke-width:1.5; }
    .box-mcu { fill:#eef4ff; stroke:#1a3a6b; stroke-width:1.5; }
    .box-sen { fill:#eefaf0; stroke:#1b5e20; stroke-width:1.5; }
    .box-mot { fill:#faf0ff; stroke:#4a148c; stroke-width:1.5; }
    .title { font:700 16px "Segoe UI",system-ui,sans-serif; fill:#111; }
    .label { font:600 12px "Segoe UI",system-ui,sans-serif; fill:#111; }
    .small { font:11px "Segoe UI",system-ui,sans-serif; fill:#333; }
    .note { font:11px "Segoe UI",system-ui,sans-serif; fill:#555; }
    .v12 { stroke:#c62828; stroke-width:2.5; fill:none; }
    .v5 { stroke:#ef6c00; stroke-width:2.2; fill:none; }
    .v33 { stroke:#1565c0; stroke-width:2; fill:none; }
    .gnd { stroke:#212121; stroke-width:2.5; fill:none; }
    .sig { stroke:#2e7d32; stroke-width:1.8; fill:none; }
    .sig2 { stroke:#6a1b9a; stroke-width:1.8; fill:none; }
    .leg { font:11px "Segoe UI",system-ui,sans-serif; fill:#222; }
  </style>
  <text x="24" y="28" class="title">Brochage ESP32-S3 — table de câblage</text>
<rect x="40" y="50" width="600" height="28" fill="#e8e8e4" stroke="#ccc"/>
<text x="48" y="68" class="label">GPIO</text>
<text x="128" y="68" class="label">Fonction</text>
<text x="288" y="68" class="label">Vers</text>
<text x="488" y="68" class="label">Fil conseillé</text>
<rect x="40" y="78" width="600" height="28" fill="#fff" stroke="#ccc"/>
<text x="48" y="96" class="small">18</text>
<text x="128" y="96" class="small">LD19 RX</text>
<text x="288" y="96" class="small">TX STL-19P (blanc)</text>
<text x="488" y="96" class="small">Blanc</text>
<rect x="40" y="106" width="600" height="28" fill="#f3f3ef" stroke="#ccc"/>
<text x="48" y="124" class="small">17</text>
<text x="128" y="124" class="small">LD19 PWM</text>
<text x="288" y="124" class="small">PWM STL-19P (noir)</text>
<text x="488" y="124" class="small">Noir</text>
<rect x="40" y="134" width="600" height="28" fill="#fff" stroke="#ccc"/>
<text x="48" y="152" class="small">8</text>
<text x="128" y="152" class="small">I2C SDA</text>
<text x="288" y="152" class="small">MPU6050 SDA</text>
<text x="488" y="152" class="small">Bleu</text>
<rect x="40" y="162" width="600" height="28" fill="#f3f3ef" stroke="#ccc"/>
<text x="48" y="180" class="small">9</text>
<text x="128" y="180" class="small">I2C SCL</text>
<text x="288" y="180" class="small">MPU6050 SCL</text>
<text x="488" y="180" class="small">Vert</text>
<rect x="40" y="190" width="600" height="28" fill="#fff" stroke="#ccc"/>
<text x="48" y="208" class="small">4</text>
<text x="128" y="208" class="small">STEP</text>
<text x="288" y="208" class="small">TMC2209 STEP</text>
<text x="488" y="208" class="small">Orange</text>
<rect x="40" y="218" width="600" height="28" fill="#f3f3ef" stroke="#ccc"/>
<text x="48" y="236" class="small">5</text>
<text x="128" y="236" class="small">DIR</text>
<text x="288" y="236" class="small">TMC2209 DIR</text>
<text x="488" y="236" class="small">Violet</text>
<rect x="40" y="246" width="600" height="28" fill="#fff" stroke="#ccc"/>
<text x="48" y="264" class="small">6</text>
<text x="128" y="264" class="small">EN</text>
<text x="288" y="264" class="small">TMC2209 EN</text>
<text x="488" y="264" class="small">Gris</text>
<rect x="40" y="274" width="600" height="28" fill="#f3f3ef" stroke="#ccc"/>
<text x="48" y="292" class="small">7</text>
<text x="128" y="292" class="small">TMC TX</text>
<text x="288" y="292" class="small">PDN via 1 kΩ (pas USART)</text>
<text x="488" y="292" class="small">Brun</text>
<rect x="40" y="302" width="600" height="28" fill="#fff" stroke="#ccc"/>
<text x="48" y="320" class="small">15</text>
<text x="128" y="320" class="small">TMC RX</text>
<text x="288" y="320" class="small">PDN direct</text>
<text x="488" y="320" class="small">Brun</text>
<rect x="40" y="330" width="600" height="28" fill="#f3f3ef" stroke="#ccc"/>
<text x="48" y="348" class="small">0</text>
<text x="128" y="348" class="small">BOOT</text>
<text x="288" y="348" class="small">Reset Wi‑Fi (maintenu)</text>
<text x="488" y="348" class="small">—</text>
<rect x="40" y="358" width="600" height="28" fill="#fff" stroke="#ccc"/>
<text x="48" y="376" class="small">GND</text>
<text x="128" y="376" class="small">Masse</text>
<text x="288" y="376" class="small">Tous les GND</text>
<text x="488" y="376" class="small">Noir</text>
<rect x="40" y="386" width="600" height="28" fill="#f3f3ef" stroke="#ccc"/>
<text x="48" y="404" class="small">3V3</text>
<text x="128" y="404" class="small">3,3 V</text>
<text x="288" y="404" class="small">MPU + TMC VIO</text>
<text x="488" y="404" class="small">Rouge clair</text>
<rect x="40" y="414" width="600" height="28" fill="#fff" stroke="#ccc"/>
<text x="48" y="432" class="small">5V</text>
<text x="128" y="432" class="small">5 V VIN</text>
<text x="288" y="432" class="small">Depuis buck</text>
<text x="488" y="432" class="small">Rouge</text>
<text x="40" y="472" class="note">Alimentations LD19 5 V et TMC VM 12 V viennent du buck / trigger, pas des pins ESP32.</text>

</svg>
